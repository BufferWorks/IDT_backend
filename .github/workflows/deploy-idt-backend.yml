name: Deploy IDT Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

      - name: Verify SSH Key
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519

      - name: Test SSH Connectivity
        run: |
          timeout 15 bash -c "</dev/tcp/${{ secrets.VPS_HOST }}/22" \
          && echo "SSH PORT OPEN" \
          || echo "SSH PORT BLOCKED"

      - name: Deploy on VPS
        run: |
          ssh \
          -o StrictHostKeyChecking=no \
          -o ConnectTimeout=20 \
          -i ~/.ssh/id_ed25519 \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

          set -e

          echo "===== STEP 1: CONNECTED ====="

          echo "===== STEP 2: CHANGE DIRECTORY ====="
          cd ${{ secrets.VPS_PATH }}

          echo "===== STEP 3: GIT PULL ====="
          git pull origin main

          echo "===== STEP 4: DOCKER DOWN ====="
          docker compose down

          echo "===== STEP 5: DOCKER BUILD ====="
          docker compose build

          echo "===== STEP 6: DOCKER UP ====="
          docker compose up -d

          echo "===== DEPLOYMENT COMPLETED ====="

          EOF

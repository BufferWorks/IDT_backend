name: Deploy IDT Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

      - name: Verify SSH Key
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519

      - name: Show Runner IP
        run: |
          echo "Runner IP:"
          curl -4 ifconfig.me
          echo ""

      - name: Test SSH Connectivity
        run: |
          if timeout 15 bash -c "</dev/tcp/${{ secrets.VPS_HOST }}/22"; then
            echo "SSH PORT OPEN"
          else
            echo "SSH PORT BLOCKED"
            exit 1
          fi

      - name: Deploy on VPS
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF

          set -e

          echo "===== CONNECTED ====="

          cd ${{ secrets.VPS_PATH }}

          echo "===== GIT PULL ====="
          git pull origin main

          echo "===== DOCKER DOWN ====="
          docker compose down

          echo "===== DOCKER BUILD ====="
          docker compose build

          echo "===== DOCKER UP ====="
          docker compose up -d

          echo "===== DEPLOYMENT COMPLETED ====="

          EOF

name: Deploy IDT Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -x
          mkdir -p ~/.ssh
          echo "mkdir OK"

          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          echo "base64 decode OK"

          chmod 600 ~/.ssh/id_ed25519
          echo "chmod OK"

          ssh-keyscan -H ${{ secrets.VPS_HOST }}
          echo "ssh-keyscan OK"

      - name: Verify SSH Key
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/id_ed25519 \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.VPS_PATH }}
            git pull origin main
            docker compose down
            docker compose build
            docker compose up -d
          EOF
